<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1017">
<title>Vault Job</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1017; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Announced to screen readers, never shown on screen. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vault Job, a top-down bank heist. Move with WASD or the arrow keys, hold Shift to sneak, press E to fry a camera with an EMP charge, press Q to toss a decoy coin. Grab the gold bars from the vault and reach the getaway van before the alarm meter fills."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
